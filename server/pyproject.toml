[project]
name = "blackwire-server"
version = "0.1.0"
description = "Blackwire v0.1 Tor-native federated encrypted DM backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.43,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "aiosqlite>=0.21.0,<1.0.0",
  "alembic>=1.16.5,<2.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "PyJWT>=2.10.1,<3.0.0",
  "argon2-cffi>=25.1.0,<26.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "redis>=6.4.0,<7.0.0",
  "orjson>=3.11.3,<4.0.0",
  "httpx>=0.28.1,<1.0.0",
  "requests>=2.32.5,<3.0.0",
  "websockets>=15.0.1,<16.0.0",
  "PyNaCl>=1.5.0,<2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2,<9.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "ruff>=0.13.2,<1.0.0",
  "mypy>=1.18.2,<2.0.0",
  "types-PyJWT>=1.7.1,<2.0.0"
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations"]

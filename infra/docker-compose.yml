services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blackwire
      POSTGRES_USER: blackwire
      POSTGRES_PASSWORD: blackwire
    ports:
      - "5432:5432"
    volumes:
      - blackwire_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackwire -d blackwire"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./example.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - blackwire_tor_data:/var/lib/tor:ro

  tor:
    image: alpine:3.20
    restart: unless-stopped
    network_mode: "service:server"
    depends_on:
      server:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache tor
        cat > /etc/tor/torrc <<'EOF'
        SocksPort 127.0.0.1:9050
        DataDirectory /var/lib/tor
        HiddenServiceDir /var/lib/tor/hidden_service/
        HiddenServiceVersion 3
        HiddenServicePort 8000 127.0.0.1:8000
        EOF
        exec tor -f /etc/tor/torrc
    volumes:
      - blackwire_tor_data:/var/lib/tor

volumes:
  blackwire_pg_data:
  blackwire_tor_data:
